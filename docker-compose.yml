services:
  api:
    build: .
    image: selective-json-disclosure:latest
    container_name: selective-json-disclosure
    ports:
      # host:container — change the left-hand side to use another host port
      - "${HOST_PORT:-8000}:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-10485760}"
      # Default proof format for POST /commit when the request omits
      # "proofMode" ("standard" keeps the legacy per-leaf response shape;
      # set to "compact" to default to the deduplicated multi-leaf proof).
      DEFAULT_PROOF_MODE: "${DEFAULT_PROOF_MODE:-standard}"
    volumes:
      # Source + requirements are mounted so the entrypoint installs and
      # runs the current working tree.
      - ./app:/app/app:ro
      - ./requirements.txt:/app/requirements.txt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
